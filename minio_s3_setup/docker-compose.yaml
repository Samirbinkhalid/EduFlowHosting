services:
  minio:
      image: minio/minio:latest
      container_name: minio
      ports:
        - "8091:9000"  # API port
        - "8092:9001"  # Console port
      volumes:
        - eduflow_minio_data:/data
      environment:
        MINIO_ROOT_USER: root
        MINIO_ROOT_PASSWORD: 29999login
      command: server --console-address ":9001" /data
      restart: unless-stopped
      healthcheck:
        test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
        interval: 30s
        timeout: 20s
        retries: 3

volumes:
  eduflow_minio_data:
    driver: local
